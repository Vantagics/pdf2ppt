name: OOXML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate generated PPTX against ECMA-376
        run: go test ./converter ./converter/goppt -count=1 -timeout 15m -run 'TestOOXML|TestTextOutline'
