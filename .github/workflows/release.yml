name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Require a green OOXML run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "waiting for OOXML on ${sha}"
          for _ in $(seq 1 60); do
            row=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ooxml.yml --commit "$sha" --limit 10 --json databaseId,status,conclusion,url,headBranch,event)
            echo "$row"
            ok=$(echo "$row" | jq -r '[.[] | select(.conclusion=="success")][0].url // empty')
            if [ -n "$ok" ]; then
              echo "OOXML green: $ok"
              exit 0
            fi
            bad=$(echo "$row" | jq -r '[.[] | select(.conclusion=="failure" or .conclusion=="cancelled")][0].url // empty')
            if [ -n "$bad" ]; then
              echo "OOXML did not pass: $bad"
              exit 1
            fi
            sleep 30
          done
          echo "no green OOXML run for ${sha}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile the CLI and pack the skill
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${spec%/*}"
            arch="${spec#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            name="pdf2ppt_${os}_${arch}${ext}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/pdf2ppt
          done
          tar -C skill -czf dist/pdf2ppt-skill.tar.gz pdf2ppt
          python3 -c 'import zipfile; from pathlib import Path; root=Path("skill/pdf2ppt"); out=Path("dist/pdf2ppt-skill.zip"); z=zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED); [z.write(p, Path("pdf2ppt")/p.relative_to(root)) for p in root.rglob("*") if p.is_file()]; z.close(); print(out, out.stat().st_size)'
          cd dist
          sha256sum pdf2ppt_* pdf2ppt-skill.tar.gz pdf2ppt-skill.zip > SHA256SUMS
          ls -l

      - name: Attach binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="CLI binaries for linux, darwin, and windows (amd64 and arm64), plus pdf2ppt-skill.tar.gz and pdf2ppt-skill.zip. See CHANGELOG.md."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "$notes"
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
