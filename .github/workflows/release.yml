name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile the CLI
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${spec%/*}"
            arch="${spec#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            name="pdf2ppt_${os}_${arch}${ext}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/pdf2ppt
          done
          cd dist
          sha256sum pdf2ppt_* > SHA256SUMS
          ls -l

      - name: Attach binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes "CLI binaries for linux, darwin, and windows (amd64 and arm64). See CHANGELOG.md."
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
